name: Build and test

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional GitHub release tag, for example v0.15.2"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential gettext intltool libtool \
            libcairo2-dev libgtk-3-dev libx11-dev libx11-xcb-dev libxcomposite-dev \
            libxdamage-dev libxext-dev libxfixes-dev libxcb-present-dev \
            pkg-config python3-cairo python3-gi python3-gi-cairo \
            python3-pytest xvfb

      - name: Run tests
        run: xvfb-run -a python3 -m pytest -q

      - name: Build glitterDE
        run: make

      - name: Create source archive
        run: make dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: glitterDE-${{ github.sha }}
          path: dist/glitterde-*.tar.gz
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.release_tag }}" dist/glitterde-*.tar.gz \
            --title "glitterDE ${{ inputs.release_tag }}" \
            --generate-notes
